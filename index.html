<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debian and Ubuntu repository</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --text: #202124;
      --muted: #5f6368;
      --panel: #ffffff;
      --border: #d8d7d2;
      --accent: #b3261e;
      --code: #1f2328;
      --code-bg: #eeeeea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171717;
        --text: #eeeeee;
        --muted: #b5b5b5;
        --panel: #222222;
        --border: #3a3a3a;
        --accent: #ffb4ab;
        --code: #eeeeee;
        --code-bg: #2d2d2d;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    h2 {
      margin: 36px 0 12px;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h2>Debian and Ubuntu repository</h2>
    <p>Package pages:</p>
    <p><a href="country-block.html">country-block for Debian</a></p>
    <p><a href="country-block-ubuntu.html">country-block for Ubuntu</a></p>
  </main>
</body>
</html>
